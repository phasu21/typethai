name: ci
on:
  push: { branches: [main] }
  pull_request:
# a new push to a pull request cancels its run still going; main runs every commit
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults: { run: { working-directory: rust } }
jobs:
  test:
    runs-on: ubuntu-latest
    # tests do not need the shipped binary's optimisation: no LTO and parallel codegen link much faster (release.yml's
    # test job sets the same, so it restores the cache this job saves on main)
    env: { CARGO_PROFILE_RELEASE_LTO: "off", CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust }
      - run: cargo test --release -p typethai-core -p typethai-desktop
