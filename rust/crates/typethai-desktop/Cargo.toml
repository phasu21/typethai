[package]
name = "typethai-desktop"
version = "0.3.1"
edition = "2021"
description = "typeThai: fix Thai typed on the wrong keyboard layout (macOS + Windows)"
repository = "https://github.com/phasu21/typethai"
license = "MIT"

[dependencies]
serde_json = "1"
unicode-segmentation = "1"
typethai-core = { path = "../typethai-core" }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.21"
gpui-kit = "0.7.3"
raw-window-handle = "0.6"
keyring = "4"

# Windows uses SChannel: ring's C build needs the Windows SDK, and SChannel trusts the OS certificate store.
[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_System_Com",
  "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_TextServices", "Win32_UI_HiDpi", "Win32_Globalization",
  "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Graphics_Dwm",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry", "NSArray", "NSRange", "NSObjCRuntime", "NSEnumerator", "NSData"] }
objc2-app-kit = { version = "0.3", features = ["NSPanel", "NSWindow", "NSResponder", "NSView", "NSTextField", "NSControl", "NSApplication", "NSScreen", "NSColor", "NSFont", "NSGraphics", "NSRunningApplication", "NSWorkspace", "NSSpellChecker", "NSPasteboard", "NSPasteboardItem"] }
