[package]
name = "typethai-core"
version = "0.1.0"
edition = "2021"
description = "typeThai engine: EN-QWERTY <-> Thai Kedmanee wrong-layout detection, normalisation, correction, personal learning"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
typethai-predict = { path = "../typethai-predict" }
