[workspace]
resolver = "2"
members = ["crates/typethai-core", "crates/typethai-desktop"]

# Dependencies (mostly GPUI) carry no debug info in dev builds: clean builds are about 13% faster and target/ is about 40% smaller.
# Workspace crates keep full debug info for lldb.
[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
